services:
  db:
    image: mysql:8.0
    container_name: quinielas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: quinielas_root
      MYSQL_DATABASE: quinielas
      MYSQL_USER: quinielas
      MYSQL_PASSWORD: quinielas_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./bd_quinielas.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uquinielas", "-pquinielas_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: quinielas_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: quinielas
      DB_PASS: quinielas_pass
      DB_SCHEMA: quinielas
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../front
    container_name: quinielas_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  db_data:
